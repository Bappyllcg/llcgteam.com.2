<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 815" width="100%" height="100%">
  <defs>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="50%" stop-color="#1e2230"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f84525"/>
      <stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
  </defs>
  <rect width="625" height="815" fill="url(#webGrad)"/>
  
  <!-- Subtle typography texture in background -->
  <text x="30" y="200" font-family="'Montserrat', sans-serif" font-weight="900" font-size="120" fill="rgba(255,255,255,0.03)" letter-spacing="-0.04em">CODE</text>
  <text x="30" y="340" font-family="'Montserrat', sans-serif" font-weight="900" font-size="120" fill="rgba(255,255,255,0.03)" letter-spacing="-0.04em">CRAFT</text>
  <text x="30" y="480" font-family="'Montserrat', sans-serif" font-weight="900" font-size="120" fill="rgba(255,255,255,0.03)" letter-spacing="-0.04em">SCALE</text>

  <!-- Editorial Interface Mockup Card -->
  <g transform="translate(60, 140)">
    <rect width="505" height="580" rx="16" fill="#181c28" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect width="505" height="44" rx="16" fill="#1f2434"/>
    <circle cx="28" cy="22" r="5" fill="#f84525"/>
    <circle cx="46" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="5" fill="#10b981"/>
    
    <!-- Hero Mockup inside -->
    <rect x="30" y="70" width="445" height="240" rx="10" fill="#0d1017"/>
    <text x="50" y="115" font-family="'Montserrat', sans-serif" font-weight="800" font-size="22" fill="#ffffff">ARCHITECTED FOR CONVERSION</text>
    <text x="50" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Sub-second load times with headless performance</text>
    <rect x="50" y="170" width="120" height="34" rx="17" fill="url(#glowRed)"/>
    <text x="75" y="192" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" letter-spacing="0.1em" fill="#ffffff">EXPLORE</text>

    <!-- 2 Column Wireframe Cards -->
    <rect x="30" y="330" width="210" height="210" rx="10" fill="#131620" stroke="rgba(255,255,255,0.06)"/>
    <text x="48" y="365" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#f84525">01 // UX Design</text>
    <text x="48" y="390" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Bespoke interaction architecture and user-tested prototypes.</text>

    <rect x="265" y="330" width="210" height="210" rx="10" fill="#131620" stroke="rgba(255,255,255,0.06)"/>
    <text x="283" y="365" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#ffffff">02 // Engineering</text>
    <text x="283" y="390" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">High-performance frontend, WebGL motion, and custom APIs.</text>
  </g>
</svg>
