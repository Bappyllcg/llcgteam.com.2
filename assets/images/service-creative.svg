<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 815" width="100%" height="100%">
  <defs>
    <linearGradient id="erpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="625" height="815" fill="url(#erpGrad)"/>
  
  <!-- Subtle typography texture in background -->
  <text x="30" y="180" font-family="'Montserrat', sans-serif" font-weight="900" font-size="110" fill="rgba(255,255,255,0.025)" letter-spacing="-0.04em">ERP</text>
  <text x="30" y="320" font-family="'Montserrat', sans-serif" font-weight="900" font-size="110" fill="rgba(255,255,255,0.025)" letter-spacing="-0.04em">SYNC</text>
  <text x="30" y="460" font-family="'Montserrat', sans-serif" font-weight="900" font-size="110" fill="rgba(255,255,255,0.025)" letter-spacing="-0.04em">ACID</text>

  <!-- Enterprise Architecture Mockup Card -->
  <g transform="translate(60, 140)">
    <rect width="505" height="580" rx="16" fill="#0b1716" stroke="rgba(16,185,129,0.25)" stroke-width="1.5"/>
    <rect width="505" height="44" rx="16" fill="#102521"/>
    <circle cx="28" cy="22" r="5" fill="#10b981"/>
    <circle cx="46" cy="22" r="5" fill="#059669"/>
    <circle cx="64" cy="22" r="5" fill="#047857"/>
    <text x="85" y="27" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#a7f3d0" letter-spacing="0.1em">ENTERPRISE ERP // MULTI-PLANT SYNC</text>
    
    <!-- ERP Nodes inside -->
    <rect x="30" y="70" width="445" height="230" rx="10" fill="#061210" stroke="rgba(255,255,255,0.05)"/>
    <text x="50" y="110" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#ffffff">MISSION-CRITICAL RESOURCE FLOW</text>
    <text x="50" y="135" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Multi-warehouse logistics, double-entry ledger &amp; payroll</text>
    
    <g transform="translate(50, 160)">
      <rect width="180" height="110" rx="8" fill="#0d231d" stroke="#10b981" stroke-width="1.2"/>
      <text x="18" y="32" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#34d399">Supply Chain Mesh</text>
      <text x="18" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">12 Plants Connected</text>
      <text x="18" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#a7f3d0">Real-Time Inventory</text>
      <text x="18" y="98" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#10b981">99.99% Core Uptime</text>

      <rect x="205" width="180" height="110" rx="8" fill="#0d231d" stroke="rgba(255,255,255,0.1)"/>
      <text x="223" y="32" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#ffffff">Automated Payroll</text>
      <text x="223" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Biometric Sync</text>
      <text x="223" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">ACID Compliance</text>
      <text x="223" y="98" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#f84525">Zero Discrepancy</text>
    </g>

    <!-- 2 Column Wireframe Cards -->
    <rect x="30" y="320" width="210" height="220" rx="10" fill="#061210" stroke="rgba(255,255,255,0.06)"/>
    <text x="48" y="355" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#10b981">01 // Architecture</text>
    <text x="48" y="380" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">PostgreSQL ACID transactions, distributed redis cache, and RBAC.</text>
    <rect x="48" y="470" width="100" height="28" rx="14" fill="#0d2820"/>
    <text x="65" y="488" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#34d399">AUDIT LOGS</text>

    <rect x="265" y="320" width="210" height="220" rx="10" fill="#061210" stroke="rgba(255,255,255,0.06)"/>
    <text x="283" y="355" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#ffffff">02 // Operations</text>
    <text x="283" y="380" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Real-time financial close, automated procurement, and custom KPI reports.</text>
    <rect x="283" y="470" width="100" height="28" rx="14" fill="url(#emeraldNeon)"/>
    <text x="303" y="488" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#022c22">HIGH SCALE</text>
  </g>
</svg>
