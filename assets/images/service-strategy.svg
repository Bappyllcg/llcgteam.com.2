<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 815" width="100%" height="100%">
  <defs>
    <linearGradient id="softGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="625" height="815" fill="url(#softGrad)"/>
  
  <!-- Subtle typography texture in background -->
  <text x="30" y="180" font-family="'Montserrat', sans-serif" font-weight="900" font-size="100" fill="rgba(255,255,255,0.025)" letter-spacing="-0.04em">CLOUD</text>
  <text x="30" y="320" font-family="'Montserrat', sans-serif" font-weight="900" font-size="100" fill="rgba(255,255,255,0.025)" letter-spacing="-0.04em">PORTAL</text>
  <text x="30" y="460" font-family="'Montserrat', sans-serif" font-weight="900" font-size="100" fill="rgba(255,255,255,0.025)" letter-spacing="-0.04em">API/REST</text>

  <!-- Web Software Architecture Mockup Card -->
  <g transform="translate(60, 140)">
    <rect width="505" height="580" rx="16" fill="#111827" stroke="rgba(99,102,241,0.25)" stroke-width="1.5"/>
    <rect width="505" height="44" rx="16" fill="#182234"/>
    <circle cx="28" cy="22" r="5" fill="#6366f1"/>
    <circle cx="46" cy="22" r="5" fill="#3b82f6"/>
    <circle cx="64" cy="22" r="5" fill="#06b6d4"/>
    <text x="85" y="27" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#c7d2fe" letter-spacing="0.1em">WEB SOFTWARE // CLOUD SAAS ENGINE</text>
    
    <!-- Hero Mockup inside -->
    <rect x="30" y="70" width="445" height="230" rx="10" fill="#090d16" stroke="rgba(255,255,255,0.05)"/>
    <text x="50" y="110" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#ffffff">CUSTOM WEB-BASED PLATFORMS</text>
    <text x="50" y="135" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Reactive microservices, real-time WebSockets &amp; high-volume APIs</text>
    
    <g transform="translate(50, 160)">
      <rect width="180" height="110" rx="8" fill="#141c2e" stroke="#6366f1" stroke-width="1.2"/>
      <text x="18" y="32" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#818cf8">Event Streams</text>
      <text x="18" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Sub-second Latency</text>
      <text x="18" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#c7d2fe">50M+ Transactions</text>
      <text x="18" y="98" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#6366f1">HIGH CONCURRENCY</text>

      <rect x="205" width="180" height="110" rx="8" fill="#141c2e" stroke="rgba(255,255,255,0.1)"/>
      <text x="223" y="32" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#ffffff">B2B SaaS Portals</text>
      <text x="223" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Modular Micro-Apps</text>
      <text x="223" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">REST / GraphQL</text>
      <text x="223" y="98" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#10b981">ZERO LOCK-IN</text>
    </g>

    <!-- 2 Column Wireframe Cards -->
    <rect x="30" y="320" width="210" height="220" rx="10" fill="#090d16" stroke="rgba(255,255,255,0.06)"/>
    <text x="48" y="355" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#6366f1">01 // Scalability</text>
    <text x="48" y="380" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Engineered for horizontal scaling, containerized microservices, and high throughput.</text>
    <rect x="48" y="470" width="100" height="28" rx="14" fill="#1e1b4b"/>
    <text x="65" y="488" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#a5b4fc">DOCKER/K8S</text>

    <rect x="265" y="320" width="210" height="220" rx="10" fill="#090d16" stroke="rgba(255,255,255,0.06)"/>
    <text x="283" y="355" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#ffffff">02 // Integration</text>
    <text x="283" y="380" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Seamless payment gateways, IoT telemetry, banking rails, and automated CRM triggers.</text>
    <rect x="283" y="470" width="100" height="28" rx="14" fill="url(#indigoGlow)"/>
    <text x="303" y="488" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#ffffff">API READY</text>
  </g>
</svg>
