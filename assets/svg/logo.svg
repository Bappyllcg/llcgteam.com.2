<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none" class="w-full h-full">
  <!-- LLCG Geometric Monogram Logo -->
  <g class="logo-mark">
    <!-- Outer sharp geometric frame -->
    <rect x="2" y="4" width="40" height="40" rx="8" fill="#1f1e1d" stroke="#f84525" stroke-width="2"/>
    <!-- Interlocking L L C G vectors -->
    <path d="M12 14v18h10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 18v14h8" stroke="#f84525" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="18" r="2.5" fill="#f84525"/>
  </g>
  <!-- Wordmark LLCG TEAM -->
  <text x="56" y="27" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" letter-spacing="0.08em" fill="currentColor">
    LLCG<tspan fill="#f84525">.</tspan>
  </text>
  <text x="56" y="39" font-family="'Montserrat', sans-serif" font-weight="600" font-size="9" letter-spacing="0.32em" fill="#9c9c9c">
    TEAM STUDIO
  </text>
</svg>
